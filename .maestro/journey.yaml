appId: app.beyond.fitness
name: First run, workout, food, progress and cardio
---
- launchApp:
    clearState: true
- takeScreenshot: 01-welcome
- tapOn: "Your name"
- inputText: "Test"
- tapOn: "Continue"
- takeScreenshot: 02-goal
- tapOn: "Continue"
- tapOn: "Continue"
- takeScreenshot: 03-week
- tapOn: "Continue"
- tapOn: "Continue"
- takeScreenshot: 04-about
- tapOn: ".*Build my program.*"
# Today shows only today's plan, which depends on the date, so the walkthrough starts its workout from Train.
- extendedWaitUntil:
    visible: "Today"
    timeout: 15000
- takeScreenshot: 05-today
- swipe:
    start: "15%, 32%"
    end: "90%, 32%"
    duration: 300
- waitForAnimationToEnd
- takeScreenshot: 05b-calendar-previous-week
- doubleTapOn:
    point: "15%, 24%"
- waitForAnimationToEnd
- takeScreenshot: 05c-calendar-back-to-today
- tapOn: "Train"
- tapOn:
    text: "Start .+"
    index: 0
- extendedWaitUntil:
    visible: ".*Complete set 1.*"
    timeout: 10000
- takeScreenshot: 06-workout
- scroll
- takeScreenshot: 07-barbell
- tapOn: ".*Complete set 1.*"
- tapOn:
    text: "Allow"
    optional: true
- takeScreenshot: 08-rest
- tapOn: "Finish"
- extendedWaitUntil:
    visible: ".*Save workout.*"
    timeout: 10000
- takeScreenshot: 09-card-front
- swipe:
    direction: LEFT
    duration: 400
- waitForAnimationToEnd
- takeScreenshot: 10-card-back
- tapOn: ".*Save workout.*"
- tapOn: "Food"
- takeScreenshot: 11-food
- tapOn: "Progress"
- takeScreenshot: 12-progress
- tapOn: "Profile"
- takeScreenshot: 13-profile
# Dynamic Island self-test: its status line shows whether iOS accepted the activity
- tapOn:
    text: ".*Rest timer.*"
    optional: true
- scrollUntilVisible:
    element: "Dynamic Island"
    optional: true
- tapOn:
    text: "Test"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 13b-island-test
- swipe:
    start: "50%, 45%"
    end: "50%, 98%"
    duration: 300
- waitForAnimationToEnd
- tapOn: "Train"
- takeScreenshot: 14-train
- tapOn: ".*Cardio.*"
- takeScreenshot: 15-cardio-plan
- tapOn: ".*Start ·.*"
- tapOn:
    text: "Allow While Using App"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 16-cardio-warmup
- tapOn:
    point: "83%, 88%"
- waitForAnimationToEnd
- takeScreenshot: 17-cardio-work
