appId: app.beyond.fitness
name: First run, workout, food and progress
---
- launchApp:
    clearState: true
- takeScreenshot: 01-welcome
- tapOn: "Your name"
- inputText: "Test"
- hideKeyboard
- tapOn: "Continue"
- takeScreenshot: 02-goal
- tapOn: "Continue"
- tapOn: "Continue"
- takeScreenshot: 03-week
- tapOn: "Continue"
- tapOn: "Continue"
- takeScreenshot: 04-about
- tapOn: "Build my program"
- extendedWaitUntil:
    visible: "Start workout"
    timeout: 15000
- takeScreenshot: 05-today
- tapOn: "Start workout"
- extendedWaitUntil:
    visible: "Complete set 1"
    timeout: 10000
- takeScreenshot: 06-workout
- scroll
- takeScreenshot: 07-barbell
- tapOn: "Complete set 1"
- tapOn:
    text: "Allow"
    optional: true
- takeScreenshot: 08-rest
- tapOn: "Finish"
- extendedWaitUntil:
    visible: "Save workout"
    timeout: 10000
- takeScreenshot: 09-card-front
- swipe:
    direction: LEFT
    duration: 400
- waitForAnimationToEnd
- takeScreenshot: 10-card-back
- tapOn: "Save workout"
- tapOn: "Food"
- takeScreenshot: 11-food
- tapOn: "Progress"
- takeScreenshot: 12-progress
- tapOn: "Train"
- takeScreenshot: 13-train
- tapOn: "Profile"
- takeScreenshot: 14-profile
