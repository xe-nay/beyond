appId: app.beyond.fitness
name: First run, workout, food, progress and cardio
---
- launchApp:
    clearState: true
- takeScreenshot: 01-welcome
- tapOn: "Your name"
- inputText: "Test"
- tapOn: "Continue"
- takeScreenshot: 02-goal
- tapOn: "Continue"
- tapOn: "Continue"
- takeScreenshot: 03-week
- tapOn: "Continue"
- tapOn: "Continue"
- takeScreenshot: 04-about
- tapOn: ".*Build my program.*"
- extendedWaitUntil:
    visible: ".*Start workout.*"
    timeout: 15000
- takeScreenshot: 05-today
- swipe:
    start: "15%, 32%"
    end: "90%, 32%"
    duration: 300
- waitForAnimationToEnd
- takeScreenshot: 05b-calendar-previous-week
- doubleTapOn:
    point: "20%, 32%"
- waitForAnimationToEnd
- takeScreenshot: 05c-calendar-back-to-today
- tapOn: ".*Start workout.*"
- extendedWaitUntil:
    visible: ".*Complete set 1.*"
    timeout: 10000
- takeScreenshot: 06-workout
# The live activity: lifting shows a dumbbell and the session time in the Dynamic Island
- pressKey: Home
- waitForAnimationToEnd
- takeScreenshot: 06b-island-lifting
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: ".*Complete set 1.*"
    timeout: 10000
- scroll
- takeScreenshot: 07-barbell
- tapOn: ".*Complete set 1.*"
- tapOn:
    text: "Allow"
    optional: true
- takeScreenshot: 08-rest
# Resting: the island turns into a countdown
- pressKey: Home
- waitForAnimationToEnd
- takeScreenshot: 08b-island-rest
- launchApp:
    stopApp: false
- waitForAnimationToEnd
- tapOn: "Finish"
- extendedWaitUntil:
    visible: ".*Save workout.*"
    timeout: 10000
- takeScreenshot: 09-card-front
- swipe:
    direction: LEFT
    duration: 400
- waitForAnimationToEnd
- takeScreenshot: 10-card-back
- tapOn: ".*Save workout.*"
- tapOn: "Food"
- takeScreenshot: 11-food
- tapOn: "Progress"
- takeScreenshot: 12-progress
- tapOn: "Profile"
- takeScreenshot: 13-profile
- tapOn: "Train"
- takeScreenshot: 14-train
- tapOn: ".*Cardio.*"
- takeScreenshot: 15-cardio-plan
- tapOn: ".*Start ·.*"
- tapOn:
    text: "Allow While Using App"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 16-cardio-warmup
- tapOn:
    point: "83%, 88%"
- waitForAnimationToEnd
- takeScreenshot: 17-cardio-work
