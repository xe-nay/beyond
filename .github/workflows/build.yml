name: Build

# iOS: builds an unsigned Beyond.ipa on a cloud Mac and publishes it with a SideStore source; every run
# is a new version. Changes to the walkthrough alone (tests, docs) do not make one: they run only
# walkthrough.yml.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.maestro/**'
      - '.github/workflows/walkthrough.yml'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Held on Xcode 26: the runners also carry newer ones, and Xcode 27 broke Maestro's driver until
      # Maestro 2.12 (mobile-dev-inc/Maestro#3701). Moving up is a deliberate change, not a surprise.
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          test -n "$XCODE" || { echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode_*.app; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # Generated at build time: the RepDB data may be used in the app but not republished as a dataset.
      - name: Build the exercise catalog
        run: node scripts/build-exercises.mjs

      - name: Test the training calculations
        run: npm test

      - name: App tests (store, flows, Live Activity order)
        run: npx jest --ci

      - name: Set the version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node scripts/set-version.mjs "$VERSION" "${{ github.run_number }}"

      - name: Generate the native project
        run: npx expo prebuild --platform ios --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install pods
        run: cd ios && pod install

      - name: Check the native modules are registered
        run: |
          # The Live Activity module is local source (modules/live-activity); a build without it shows nothing.
          {
            echo "== modules/live-activity"; ls -R modules/live-activity
            echo "== autolinking"; npx expo-modules-autolinking resolve -p ios 2>&1 | grep -i -B2 -A6 "live" || echo "not found by autolinking"
            echo "== Podfile.lock"; grep -n "LiveActivity" ios/Podfile.lock || echo "not in Podfile.lock"
            echo "== providers"; find ios -name "ExpoModulesProvider.swift" -exec grep -Hn "LiveActivity" {} + || echo "no provider mentions it yet"
          } | tee native-check.txt
          grep -q "LiveActivity" ios/Podfile.lock || { echo "::error::LiveActivity native module is missing from the pods"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-check
          path: native-check.txt
          retention-days: 14

      - name: Build
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          set +e
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > xcodebuild.log 2>&1
          STATUS=$?
          set -e
          grep -E "error:|\*\* BUILD" xcodebuild.log | tail -80 || true
          exit $STATUS

      - name: Package the IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Beyond.ipa Payload
          ls -lh Beyond.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Beyond-ipa
          path: Beyond.ipa
          retention-days: 14

      # Stable links the iPhone downloads from: the installer and the app source read by SideStore.
      - name: Publish the latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/make-source.mjs "${{ github.repository }}" "$VERSION" "$(stat -f%z Beyond.ipa)" > source.json
          # SideStore reads the source and downloads the app from the store branch
          # (raw.githubusercontent.com/<repo>/store/source.json), which kept working while GitHub's release
          # downloads answered 504 or nothing for hours ("not valid JSON" in SideStore). The release keeps
          # copies for older links. One commit, replaced each build, app and source together.
          mkdir -p store-branch && cp Beyond.ipa source.json store-branch/ && cd store-branch
          git init -q -b store && git add Beyond.ipa source.json
          git -c user.name=Beyond -c user.email=beyond@users.noreply.github.com commit -q -m "Beyond $VERSION"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" store
          cd ..
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Beyond.ipa source.json --title "Beyond $VERSION" --notes "Build $VERSION" --latest
          # The release is made as a draft while its files upload; once it was left a draft, and SideStore
          # then had no version at all (the previous one is deleted above).
          gh release edit latest --draft=false --latest

      - name: Keep the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
